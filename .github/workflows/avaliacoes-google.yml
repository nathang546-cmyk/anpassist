name: Atualizar avaliações do Google

on:
  schedule:
    - cron: "0 11 * * *" # todo dia às 08:00 de Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar nota e avaliações
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/atualizar-google.mjs

      - name: Salvar e republicar se mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/google.js; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/google.js
          git commit -m "Atualiza avaliações do Google"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
